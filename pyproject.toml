[project]
name = "interview-app"
version = "0.1.0"
description = "AI interview practice app: guided Q&A sessions and job-description analysis, routed through a security guard to OpenRouter."
readme = "README.md"
authors = [
    { name = "Sonali Hirave", email = "hiravesonali@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "authlib>=1.3",
    "openai>=3.42.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.13.1",
    "pypdf>=6.21.4",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "reportlab>=5.1.0",
    "sqlalchemy>=2.0",
    "streamlit>=1.66.1",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "openpyxl>=3.1.5",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"src/interview_app/ui/theme.py" = ["E501"]  # CSS/SVG strings
